[project]
name = "mardik"
version = "2.0.0"
description = "Mardik — analyse de contrats par LLM : livrer et piloter la nouvelle version (chaîne LLMOps & observabilité)."
requires-python = ">=3.11,<3.13"
dependencies = [
    "fastapi>=0.115,<0.120",
    "uvicorn[standard]>=0.30,<0.40",
    "pydantic>=2.7,<3",
    "httpx>=0.27,<0.30",
    "pyyaml>=6,<7",
    "opentelemetry-api>=1.27,<2",
    "opentelemetry-sdk>=1.27,<2",
    "structlog>=24,<26",
    "python-dotenv>=1,<2",
]

[dependency-groups]
dev = [
    "markdown>=3.11",
    "pytest>=8,<9",
    "ruff>=0.6,<0.10",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app", "ops", "eval", "scripts"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py311"
exclude = ["eval/contrats"]
